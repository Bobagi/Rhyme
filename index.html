<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta property="og:type" content="website" />

    <meta property="og:url" content="https://rhyme.bobagi.space/" />
    <meta property="og:title" content="Rhyme — Treinador de Rima e Freestyle em Tempo Real" />
    <meta property="og:description" content="Fale no microfone e veja rimas perfeitas e toantes na hora. Treine improviso em PT, EN e ES — grátis, direto no navegador." />
    <meta property="og:image" content="https://rhyme.bobagi.space/og-image.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Rhyme — Treinador de Rima e Freestyle em Tempo Real" />
    <meta name="twitter:description" content="Fale no microfone e veja rimas perfeitas e toantes na hora. Treine improviso em PT, EN e ES — grátis, no navegador." />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Rhyme",
        "alternateName": "Rhyme — Treinador de Rima e Freestyle",
        "url": "https://rhyme.bobagi.space/",
        "description": "Treinador de rima e freestyle em tempo real: fale no microfone e veja rimas perfeitas e toantes na hora, em português, inglês e espanhol.",
        "applicationCategory": "MultimediaApplication",
        "operatingSystem": "Web (Google Chrome)",
        "browserRequirements": "Requires the Web Speech API (Google Chrome) and microphone access.",
        "inLanguage": ["pt-BR", "en-US", "es-ES"],
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "BRL" },
        "image": "https://rhyme.bobagi.space/og-image.png",
        "author": { "@type": "Person", "name": "Gustavo Perin", "alternateName": "Bobagi" }
      }
    </script>

    <style>
      :root {
        color-scheme: dark;
        --yellow: #ffd43b;
        --yellow-strong: #fab005;
        --yellow-soft: #fff3bf;
        --red: #ff4d4f;
        --red-dark: #c92a2a;
        --black: #050505;
        --panel: rgba(18, 18, 16, 0.9);
        --panel-strong: rgba(31, 29, 18, 0.92);
        --border: rgba(255, 212, 59, 0.22);
        --text: #fff9db;
        --muted: #c9bd8f;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        padding: 28px 16px;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at 18% 0%, rgba(255, 212, 59, 0.2), transparent 28rem),
          radial-gradient(circle at 90% 24%, rgba(250, 176, 5, 0.12), transparent 24rem),
          linear-gradient(135deg, #050505 0%, #12100a 52%, #070707 100%);
      }

      .container {
        width: min(1040px, 100%);
        margin: 0 auto;
        padding: 22px;
        border: 1px solid var(--border);
        border-radius: 26px;
        background: rgba(5, 5, 5, 0.78);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.48), inset 0 1px 0 rgba(255, 255, 255, 0.04);
      }

      .hero {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 16px;
        align-items: flex-start;
        padding: 18px;
        border: 1px solid var(--border);
        border-radius: 22px;
        background: linear-gradient(135deg, rgba(255, 212, 59, 0.14), rgba(255, 255, 255, 0.035));
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
      }
      .hero-text { flex: 1 1 320px; min-width: 0; }

      .lang-switcher {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 5px 8px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.28);
      }
      .lang-globe { font-size: 0.9rem; margin-right: 2px; opacity: 0.8; }
      .lang-option {
        border: 0;
        border-radius: 999px;
        padding: 5px 9px;
        color: var(--yellow-soft);
        background: transparent;
        font: inherit;
        font-size: 0.74rem;
        font-weight: 950;
        letter-spacing: 0.04em;
        cursor: pointer;
      }
      .lang-option.is-active { color: #090909; background: linear-gradient(135deg, var(--yellow), var(--yellow-strong)); }

      .eyebrow {
        margin: 0 0 8px;
        color: var(--yellow);
        font-size: 0.76rem;
        font-weight: 900;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 5vw, 3.8rem);
        line-height: 0.95;
        letter-spacing: -0.05em;
      }

      h1 span { color: var(--yellow); }

      .intro {
        max-width: 620px;
        margin: 10px 0 0;
        color: var(--muted);
        line-height: 1.5;
      }

      .listen-controls {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
        margin-top: 16px;
      }

      .listen-button {
        min-width: 190px;
        border: 0;
        border-radius: 999px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
        padding: 14px 20px;
        color: #090909;
        background: linear-gradient(135deg, var(--yellow), var(--yellow-strong));
        box-shadow: 0 14px 30px rgba(250, 176, 5, 0.25);
        font: inherit;
        font-weight: 950;
        cursor: pointer;
        transition: transform 160ms ease, box-shadow 160ms ease, background 160ms ease;
      }

      .listen-button:hover { transform: translateY(-2px); box-shadow: 0 18px 38px rgba(250, 176, 5, 0.34); }
      .listen-button.is-listening { color: white; background: linear-gradient(135deg, var(--red), var(--red-dark)); box-shadow: 0 14px 30px rgba(255, 77, 79, 0.24); }
      .listen-icon { font-size: 0.9rem; line-height: 1; }
      .microphone-label {
        min-height: 50px;
        max-width: min(420px, 100%);
        display: inline-flex;
        align-items: center;
        padding: 14px 20px;
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: 999px;
        color: var(--yellow-soft);
        background: rgba(255, 212, 59, 0.08);
        font-size: 0.9rem;
        font-weight: 750;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .status-row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
        min-height: 0;
        margin: 14px 0;
      }

      .warning, .error { line-height: 1.45; }
      .warning { color: #ff8787; font-weight: 800; }
      .error { color: #ff8787; }

      .grid {
        display: grid;
        grid-template-columns: 0.9fr 1.1fr;
        gap: 14px;
      }

      .panel {
        position: relative;
        min-height: 112px;
        padding: 16px;
        border: 1px solid var(--border);
        border-radius: 20px;
        background: linear-gradient(180deg, var(--panel-strong), var(--panel));
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04), 0 14px 34px rgba(0, 0, 0, 0.22);
        overflow: hidden;
      }

      .panel > * { position: relative; z-index: 1; }
      .panel.large { grid-column: 1 / -1; min-height: auto; }
      .panel.compact { min-height: 92px; }

      .panel-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 10px;
        color: var(--yellow);
        font-size: 0.78rem;
        font-weight: 950;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .language-filter {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: var(--yellow-soft);
        letter-spacing: 0.06em;
      }

      .language-filter-option {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 1px solid rgba(255, 212, 59, 0.24);
        border-radius: 999px;
        padding: 6px 10px;
        color: var(--yellow-soft);
        background: rgba(255, 212, 59, 0.08);
        font: inherit;
        font-size: 0.72rem;
        font-weight: 950;
        cursor: pointer;
      }

      .language-filter-option.is-active {
        color: #090909;
        background: linear-gradient(135deg, var(--yellow), var(--yellow-strong));
      }

      .flag {
        position: relative;
        display: inline-block;
        width: 18px;
        height: 12px;
        overflow: hidden;
        border-radius: 2px;
        box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.2);
      }

      .flag-br { background: #009b3a; }
      .flag-br::before {
        content: '';
        position: absolute;
        left: 4px;
        top: 1px;
        width: 10px;
        height: 10px;
        background: #ffdf00;
        transform: rotate(45deg);
      }
      .flag-br::after {
        content: '';
        position: absolute;
        left: 6px;
        top: 3px;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #002776;
      }

      .flag-us {
        background: repeating-linear-gradient(to bottom, #b22234 0 1px, #fff 1px 2px);
      }
      .flag-us::before {
        content: '';
        position: absolute;
        left: 0;
        top: 0;
        width: 8px;
        height: 7px;
        background: #3c3b6e;
      }

      .flag-es { background: linear-gradient(to bottom, #aa151b 0 25%, #f1bf00 25% 75%, #aa151b 75%); }

      .transcript {
        margin: 0;
        color: var(--yellow-soft);
        font-size: clamp(1rem, 2vw, 1.22rem);
        line-height: 1.45;
        user-select: text;
      }

      .meter {
        height: 16px;
        overflow: hidden;
        border: 1px solid rgba(255, 212, 59, 0.2);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
      }

      #microphoneLevelBar {
        height: 100%;
        width: 0%;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--yellow-strong), var(--yellow), #fff9db);
        box-shadow: 0 0 18px rgba(255, 212, 59, 0.38);
        transition: width 80ms linear;
      }

      ul {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 10px 0 0;
        padding: 0;
        list-style: none;
        user-select: text;
      }

      li {
        padding: 7px 10px;
        border: 1px solid rgba(255, 212, 59, 0.2);
        border-radius: 999px;
        color: var(--yellow-soft);
        background: rgba(255, 212, 59, 0.08);
        user-select: text;
      }

      .selectable-panel, .selectable-panel * { user-select: text; }
      #finalTranscriptHistory li { border-radius: 12px; background: rgba(255, 255, 255, 0.05); }

      #rhymeSuggestionsList li {
        cursor: pointer;
        transition: transform 120ms ease, background 120ms ease, border-color 120ms ease;
      }
      #rhymeSuggestionsList li:hover {
        border-color: var(--yellow);
        background: rgba(255, 212, 59, 0.16);
        transform: translateY(-1px);
      }
      #rhymeSuggestionsList li.is-copied {
        color: #090909;
        background: linear-gradient(135deg, var(--yellow), var(--yellow-strong));
        border-color: var(--yellow-strong);
      }
      .copy-toast {
        position: absolute;
        right: 16px;
        bottom: 14px;
        padding: 7px 12px;
        border-radius: 999px;
        color: #090909;
        font-size: 0.74rem;
        font-weight: 950;
        background: linear-gradient(135deg, var(--yellow), var(--yellow-strong));
        box-shadow: 0 10px 24px rgba(250, 176, 5, 0.3);
        opacity: 0;
        transform: translateY(6px);
        transition: opacity 140ms ease, transform 140ms ease;
        pointer-events: none;
        z-index: 2;
      }
      .copy-toast.is-visible { opacity: 1; transform: translateY(0); }

      /* training panel */
      .ghost-button {
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 6px 12px;
        color: var(--yellow-soft);
        background: rgba(255, 212, 59, 0.08);
        font: inherit;
        font-size: 0.74rem;
        font-weight: 900;
        cursor: pointer;
        transition: background 140ms ease, border-color 140ms ease, transform 140ms ease;
      }
      .ghost-button:hover { border-color: var(--yellow); background: rgba(255, 212, 59, 0.16); }

      .training-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
      .stat {
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: 14px;
        background: rgba(255, 212, 59, 0.06);
      }
      .stat-label { color: var(--muted); font-size: 0.68rem; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; }
      .stat-value { color: var(--text); font-size: 1.6rem; font-weight: 950; line-height: 1.1; }

      .training-feedback { margin: 12px 0 0; min-height: 1.4em; color: var(--yellow-soft); font-weight: 800; }
      .training-feedback[data-tier="perfect"] { color: #7cfc9a; }
      .training-feedback[data-tier="slant"] { color: var(--yellow); }
      .training-feedback[data-tier="toante"] { color: var(--yellow-soft); }
      .training-feedback[data-tier="none"], .training-feedback[data-tier="same"] { color: #ff8787; }

      .training-tools { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px; }
      .tool {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 12px;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.03);
      }
      .tool-label { color: var(--yellow); font-size: 0.7rem; font-weight: 950; letter-spacing: 0.1em; text-transform: uppercase; }
      .tool-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
      .challenge-word { font-size: 1.35rem; font-weight: 950; color: var(--text); }
      .bpm-slider { width: 130px; max-width: 45vw; accent-color: var(--yellow-strong); cursor: pointer; }
      .bpm-readout { color: var(--text); font-size: 0.82rem; font-weight: 800; }
      .bpm-readout strong { color: var(--yellow); }
      .bpm-hint { color: var(--muted); font-size: 0.7rem; font-weight: 700; }
      .beat-toggle.is-active { color: #090909; background: linear-gradient(135deg, var(--yellow), var(--yellow-strong)); border-color: var(--yellow-strong); }
      .beat-dot {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: rgba(255, 212, 59, 0.25);
        box-shadow: inset 0 0 0 1px var(--border);
        transition: transform 90ms ease, background 90ms ease, box-shadow 90ms ease;
      }
      .beat-dot.is-pulsing { background: var(--yellow); transform: scale(1.5); box-shadow: 0 0 16px rgba(255, 212, 59, 0.7); }

      /* rhyme tier badges */
      .rhyme-badge {
        margin-left: 7px;
        padding: 1px 6px;
        border-radius: 999px;
        font-size: 0.62rem;
        font-weight: 950;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        vertical-align: middle;
        color: var(--muted);
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      #rhymeSuggestionsList li[data-tier="slant"] { border-color: rgba(255, 212, 59, 0.3); }
      #rhymeSuggestionsList li[data-tier="slant"] .rhyme-badge { color: var(--yellow); }
      #rhymeSuggestionsList li[data-tier="toante"] { border-style: dashed; opacity: 0.92; }

      .badges { gap: 8px; margin-top: 14px; }
      .badges li { cursor: default; font-size: 0.8rem; font-weight: 800; color: var(--yellow-soft); background: rgba(255, 212, 59, 0.1); }

      .site-footer {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 18px;
        align-items: center;
        justify-content: space-between;
        margin-top: 18px;
        padding-top: 16px;
        border-top: 1px solid var(--border);
        color: var(--muted);
        font-size: 0.82rem;
      }
      .site-footer a { color: var(--yellow); text-decoration: none; font-weight: 800; }
      .site-footer a:hover { text-decoration: underline; }

      @media (max-width: 760px) {
        body { padding: 14px; }
        .container { padding: 14px; border-radius: 22px; }
        .hero, .grid { grid-template-columns: 1fr; }
        .listen-button, .microphone-label { width: 100%; }
        .training-tools { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
